<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoodlIA Rubrics</title>
    <link rel="stylesheet" href="../options/styles.css">
  </head>
  <body>
    <main class="options-shell">
      <header class="options-header">
        <img src="../images/icon-128.png" alt="" width="52" height="52">
        <div>
          <p class="options-eyebrow" data-i18n="extensionName"></p>
          <h1 data-i18n="whatsNewTitle"></h1>
        </div>
      </header>

      <section class="options-card">
        <p class="options-intro" data-i18n="whatsNewIntro"></p>
        <ol class="whats-new-steps">
          <li data-i18n="whatsNewStepClick"></li>
          <li data-i18n="whatsNewStepAlways"></li>
        </ol>
        <p class="options-hint" data-i18n="whatsNewPin"></p>
        <p class="options-hint" data-i18n="whatsNewSites"></p>
      </section>
    </main>

    <script src="../scripts/i18n.js"></script>
    <script src="whats-new.js"></script>
  </body>
</html>
